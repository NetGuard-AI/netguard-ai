name: Deploy NetGuard AI frontend to GitHub Pages

on:
  push:
    branches:
      - main
    paths:
      - "m6_frontend/**"
      - ".github/workflows/deploy-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: m6_frontend/package-lock.json

      - name: Install dependencies
        working-directory: m6_frontend
        run: npm ci

      - name: Build frontend
        working-directory: m6_frontend
        env:
          VITE_API_BASE_URL: https://netguard-ai-api-lh0a.onrender.com
        run: npm run build

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: m6_frontend/dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
